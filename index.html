const FILTERS = {
  mood: {label: ["すべて","がっつり","ほっこり","さっぱり"], val: [null,"がっつり","ほっこり","さっぱり"]},
  main: {label: ["すべて","肉","魚","野菜","麺・ごはん"], val: [null,"肉","魚","野菜","麺・ごはん"]},
  time: {label: ["指定なし","15分まで","30分まで"], val: [null,15,30]},
  genre: {label: ["すべて","沖縄料理"], val: [null,"沖縄"]}
};
const state = {mood: 0, main: 0, time: 0, genre: 0};
const OKI = new Set(["ゴーヤチャンプルー","ソーキそば","タコライス","ラフテー","ポークたまご定食","そーめんチャンプルー","ソーミンタシヤー","豆腐チャンプルー","フーチャンプルー","ナーベーラーンブシー","ジューシー","クーブイリチー","ゆし豆腐","アーサ汁","もずくの天ぷら","グルクンの唐揚げ"]);
let current = null, rejected = new Set(), history = [], busy = false;

const $ = id => document.getElementById(id);
const store = {
  get(){ try { return JSON.parse(localStorage.getItem("dinner-history") || "[]"); } catch(e){ return []; } },
  set(v){ try { localStorage.setItem("dinner-history", JSON.stringify(v)); } catch(e){} }
};

function renderChips(){
  document.querySelectorAll(".chips").forEach(box => {
    const k = box.dataset.key; box.innerHTML = "";
    FILTERS[k].label.forEach((lab, i) => {
      const b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = lab;
      b.setAttribute("aria-pressed", state[k] === i);
      b.onclick = () => { state[k] = i; rejected.clear(); renderChips(); };
      box.appendChild(b);
    });
  });
}

function pool(){
  const f = Object.fromEntries(Object.keys(FILTERS).map(k => [k, FILTERS[k].val[state[k]]]));
  const recent = new Set(history.slice(0, 3).map(h => h.n));
  let list = DISHES.filter(d =>
    (!f.mood || d.mood === f.mood) && (!f.main || d.main === f.main) && (!f.time || d.time <= f.time) && (!f.genre || OKI.has(d.n)) && !rejected.has(d.n));
  const fresh = list.filter(d => !recent.has(d.n));
  return fresh.length ? fresh : list;
}

function show(d){
  current = d;
  $("dish").textContent = d.n;
  $("meta").textContent = (OKI.has(d.n) ? "沖縄料理・" : "") + d.mood + "・" + d.main + "・約" + d.time + "分";
  $("skip").disabled = false; $("ok").disabled = false;
  const r = REC[d.n], box = $("recipe");
  if (!r){ box.hidden = true; return; }
  $("ing").innerHTML = ""; $("steps").innerHTML = "";
  r.ing.forEach(x => { const li = document.createElement("li"); li.textContent = x; $("ing").appendChild(li); });
  r.st.forEach(x => { const li = document.createElement("li"); li.textContent = x; $("steps").appendChild(li); });
  box.hidden = false;
}

function pick(){
  if (busy) return;
  const list = pool();
  if (!list.length){
    current = null;
    $("recipe").hidden = true;
    $("dish").textContent = "条件に合う料理がありません";
    $("meta").textContent = "絞り込みをゆるめてみてください";
    $("skip").disabled = true; $("ok").disabled = true;
    return;
  }
  const final = list[Math.floor(Math.random() * list.length)];
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce){ show(final); return; }
  busy = true; $("go").disabled = true;
  $("dish").classList.add("spin"); $("meta").textContent = ""; $("recipe").hidden = true;
  let i = 0;
  const t = setInterval(() => {
    $("dish").textContent = DISHES[Math.floor(Math.random() * DISHES.length)].n;
    if (++i > 10){
      clearInterval(t); $("dish").classList.remove("spin");
      show(final); busy = false; $("go").disabled = false;
    }
  }, 70);
}

function renderHist(){

  }
  history.slice(0, 7).forEach(h => {
    const li = document.createElement("li");
    li.innerHTML = "<div></div><span></span>";
    li.firstChild.textContent = h.n; li.lastChild.textContent = h.d;
    ul.appendChild(li);
  });
  $("clear").hidden = !history.length;
}

const FR_GROUPS = [
  ["肉・卵",["豚肉","鶏肉","牛肉","ひき肉","ささみ","手羽先","ベーコン・ハム","卵"]],
  ["魚介",["魚介","鮭","さば","えび","いか","たこ","ほたて","あさり","しらす","たらこ","ちくわ・かまぼこ","海藻"]],
  ["野菜",["玉ねぎ","キャベツ","白菜","大根","にんじん","じゃがいも","トマト","なす","ピーマン","パプリカ","もやし","ねぎ","ほうれん草","小松菜","青梗菜","きゅうり","レタス","かぼちゃ","ごぼう・れんこん","オクラ","ブロッコリー","アスパラ","ズッキーニ","セロリ","さつまいも","里芋","長いも","ししとう","とうもろこし","かぶ","枝豆","アボカド","豆苗"]],
  ["きのこ・豆・乾物",["きのこ","まいたけ","エリンギ","なめこ","豆腐","厚揚げ","油揚げ","納豆","豆乳","ひじき","春雨","切り干し大根","こんにゃく"]],
  ["主食・乳製品",["ご飯・米","麺","パン","餅","チーズ","牛乳","ヨーグルト","コーン"]]
];
const ORDERED = FR_GROUPS.flatMap(g => g[1]);
const GRP = Object.fromEntries(FR_GROUPS.map(g => [g[1][0], g[0]]));
const sel = new Set();

function renderFr(){
  const box = $("frchips"); box.innerHTML = "";
  ORDERED.forEach(l => {
    if (GRP[l]){ const h = document.createElement("div"); h.className = "grp"; h.textContent = GRP[l]; box.appendChild(h); }
    const b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.textContent = l;
    b.setAttribute("aria-pressed", sel.has(l));
    b.onclick = () => { sel.has(l) ? sel.delete(l) : sel.add(l); renderFr(); frUpdate(); };
    box.appendChild(b);
  });
}

function findFr(){
  const ul = $("frres"); ul.innerHTML = "";
  const custom = $("frtext").value.split(/[、,，\s]+/).filter(Boolean);
  const msg = t => { ul.innerHTML = '<li class="msg"></li>'; ul.firstChild.textContent = t; };
  if (!sel.size && !custom.length){ msg("食材を選ぶか、入力してください"); return; }
  const out = [];
  DISHES.forEach(d => {
    const r = REC[d.n]; if (!r) return;
    const txt = r.ing.join(" ").replace(/牛乳/g, "ミルク").replace(/鶏がらスープ/g, "スープ");
    const hits = [];
    FR.forEach(([l, keys]) => {
      if (!sel.has(l)) return;
      const t = l === "ねぎ" ? txt.replace(/玉ねぎ/g, "") : txt;
      if (keys.some(k => t.includes(k))) hits.push(l);
    });
    custom.forEach(w => { if (txt.includes(w)) hits.push(w); });
    if (hits.length) out.push({d, hits, n: r.ing.length});
  });
  out.sort((a, b) => b.hits.length - a.hits.length || a.n - b.n);
  if (!out.length){ msg("合う料理が見つかりませんでした"); return; }
  out.slice(0, 6).forEach(o => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = "res"; b.type = "button";
    b.innerHTML = "<b></b><small></small>";
    b.firstChild.textContent = o.d.n;
    b.lastChild.textContent = "使う食材：" + o.hits.join("・") + "　約" + o.d.time + "分";
    b.onclick = () => { show(o.d); window.scrollTo({top: 0, behavior: "smooth"}); };
    li.appendChild(b); ul.appendChild(li);
  });
}
$("frgo").onclick = () => frUpdate();
$("frtext").addEventListener("input", () => { clearTimeout(frTimer); frTimer = setTimeout(frUpdate, 250); });
$("frtext").addEventListener("keydown", e => { if (e.key === "Enter" && !e.isComposing){ e.preventDefault(); frUpdate(); e.target.blur(); } });
let frTimer;

const kana = s => s.replace(/[\u30a1-\u30f6]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60))
  .replace(/[Ａ-Ｚａ-ｚ０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xfee0)).toLowerCase();
const ALIAS = {"人参":"にんじん","玉葱":"玉ねぎ","たまねぎ":"玉ねぎ","葱":"ねぎ","長ねぎ":"ねぎ","茄子":"なす","蓮根":"れんこん","牛蒡":"ごぼう","南瓜":"かぼちゃ","胡瓜":"きゅうり","椎茸":"しいたけ","挽肉":"ひき肉","ミンチ":"ひき肉","たまご":"卵","玉子":"卵","海老":"えび","生姜":"しょうが","大蒜":"にんにく","サーモン":"鮭","お米":"米","パスタ":"スパゲッティ","厚揚げ":"豆腐","鶏肉":"鶏","豚肉":"豚","牛肉":"牛","むね肉":"鶏むね","もも肉":"鶏もも","ごはん":"ご飯","白米":"ご飯","ジャガ芋":"じゃがいも","じゃが芋":"じゃがいも","ポテト":"じゃがいも","あすぱらがす":"アスパラ","ぶろっこり":"ブロッコリー","こまつな":"小松菜","しそ":"大葉","山芋":"長いも","ながいも":"長いも","さつま芋":"さつまいも","薩摩芋":"さつまいも","舞茸":"まいたけ","蒟蒻":"こんにゃく","もち":"餅","鱈":"たら","烏賊":"いか","蛸":"たこ","帆立":"ほたて","浅蜊":"あさり","鯵":"あじ","鰯":"いわし","秋刀魚":"さんま","鰤":"ぶり","明太子":"たらこ","里いも":"里芋","さといも":"里芋","青ねぎ":"ねぎ","小ねぎ":"ねぎ","食パン":"パン","お肉":"肉"};
function frUpdate(){
  const ul = $("frres"); ul.innerHTML = "";
  const orig = $("frtext").value.split(/[、,，・\s]+/).filter(Boolean);
  if (!sel.size && !orig.length) return;
  const terms = [];
  FR.forEach(([l, keys]) => { if (sel.has(l)) terms.push({label: l, keys: keys.map(kana)}); });
  orig.forEach(o => {
    const w = kana(o), keys = new Set([w]);
    const al = ALIAS[o] || ALIAS[w]; if (al) keys.add(kana(al));
    FR.forEach(([l, ks]) => { const k2 = ks.map(kana); if (kana(l) === w || k2.includes(w) || (w.length > 1 && kana(l).includes(w))) k2.forEach(k => keys.add(k)); });
    terms.push({label: o, keys: [...keys]});
  });
  const used = new Set(), out = [];
  DISHES.forEach(d => {
    const r = REC[d.n]; if (!r) return;
    const t1 = kana(r.ing.join(" ").replace(/牛乳/g, "ミルク").replace(/鶏がらスープ/g, "スープ"));
    const t2 = t1.replace(/玉ねぎ/g, "");
    const t3 = t1.replace(/ぱん粉/g, "");
    const hits = [];
    terms.forEach(tm => {
      if (tm.keys.some(k => (k === "ねぎ" ? t2 : k === "ぱん" ? t3 : t1).includes(k))){ hits.push(tm.label); used.add(tm.label); }
    });
    if (hits.length) out.push({d, hits, n: r.ing.length});
  });
  out.sort((a, b) => b.hits.length - a.hits.length || a.n - b.n);
  const add = text => { const li = document.createElement("li"); li.className = "msg"; li.textContent = text; ul.appendChild(li); };
  const missing = orig.filter(o => !used.has(o));
  if (!out.length){ add("合う料理が見つかりませんでした。ひらがな・カタカナ・漢字どれでも探せますが、登録料理の材料にない食材は出ません。"); return; }
  if (missing.length) add("「" + missing.join("」「") + "」を使う料理はありませんでした");
  out.slice(0, 8).forEach(o => {
    const li = document.createElement("li"), b = document.createElement("button");
    b.className = "res"; b.type = "button";
    b.innerHTML = "<b></b><small></small>";
    b.firstChild.textContent = o.d.n;
    b.lastChild.textContent = "使う食材：" + o.hits.join("・") + "　約" + o.d.time + "分";
    b.onclick = () => { show(o.d); window.scrollTo({top: 0, behavior: "smooth"}); };
    li.appendChild(b); ul.appendChild(li);
  });
}
